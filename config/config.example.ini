# Configuration template.
# Copy this file to config/config.ini and adjust the values for your setup.
#
# Secrets are NOT stored here. Set them as environment variables
# (or in a git-ignored .env file in the repository root):
#   OPENAI_API_KEY      API key for the generative AI model
#   PROJECTOR_PASSWORD  SSH password of the BeagleBone that drives the projector

[Models]
VISION_MODEL = gpt-4o-mini
TEXT_MODEL = gpt-4o-mini
MAX_TOKENS = 500
SVG_MAX_TOKENS = 1000
DETECTION_TEMPERATURE = 0.2
GENERATION_TEMPERATURE = 0.7

[Projector]
# BeagleBone Black reached over USB networking (default address 192.168.7.2)
HOST = 192.168.7.2
USERNAME = debian
# Directory on the BeagleBone containing the display script; images are uploaded to <REMOTE_DIR>/images
REMOTE_DIR = /opt/scripts/device/bone/capes/DLPDLCR2000
DISPLAY_SCRIPT = display_image.py
# Rotate cues by 180 degrees before upload (projector mounted upside down)
ROTATE_180 = true
# Run the display script with sudo (needed to write to the framebuffer)
USE_SUDO = true

[Camera]
WIDTH = 1280
HEIGHT = 720

[CriticalSteps]
# A step is critical when its recorded error count is greater than this value
ERROR_THRESHOLD = 5

[Paths]
# Relative paths are resolved from the repository root
BASE_DIR = .

# Inputs
ASSEMBLY_TASKS_FILE = data/assembly_tasks.xlsx
ERROR_HISTORY_FILE = data/error_history.sample.xlsx
OPERATOR_PROFILES_FILE = data/operator_profiles.sample.xlsx
REFERENCE_IMAGES_DIR = data/reference_images

# Runtime outputs (git-ignored)
CAPTURED_IMAGES_DIR = outputs/captured_images
RESULTS_DIR = outputs/detection_logs
VISUAL_CUES_DIR = outputs/visual_cues
AUDIO_DIR = outputs/audio
LOG_DIR = outputs/sessions
