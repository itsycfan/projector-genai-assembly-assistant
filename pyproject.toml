[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-genai-assembly-assistant"
version = "1.0.0"
description = "Projector-based generative AI assistant for manual assembly"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "cairosvg>=2.7",
    "gTTS>=2.5",
    "paramiko>=3.4",
    "python-dotenv>=1.0",
    "playsound==1.2.2; sys_platform == 'win32'",
]

[project.scripts]
projector-assistant = "projector_assembly_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projector_assembly_assistant = ["prompts/*.txt"]
